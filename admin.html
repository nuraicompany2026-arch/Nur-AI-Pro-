<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUR AI ADMIN</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #080510;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: 40px auto;
  padding: 25px;
  background: #171027;
  border: 1px solid #792dce;
  border-radius: 18px;
  box-shadow: 0 0 25px #54208b;
}

h1 {
  color: #c18aff;
  text-align: center;
}

#status {
  text-align: center;
  color: #a9ffbd;
}

input {
  width: 100%;
  padding: 15px;
  margin: 15px 0;
  background: #090612;
  border: 1px solid #8c43db;
  color: white;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 15px;
  background: #792dce;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
}

#result {
  margin-top: 20px;
  padding: 15px;
  background: #090612;
  border-radius: 10px;
  min-height: 50px;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="container">
  <h1>NUR AI ADMIN</h1>

  <p id="status">Сервер тексерілуде...</p>

  <h3>Басқару командалары</h3>

  <input
    id="command"
    placeholder="Команда енгізіңіз..."
  >

  <button onclick="sendCommand()">
    КОМАНДАНЫ ОРЫНДАУ
  </button>

  <div id="result">Жауап күтілуде...</div>
</div>

<script>
async function checkStatus() {
  try {
    const response = await fetch("/status");
    const data = await response.json();

    document.getElementById("status").textContent =
      data.name + " — " + data.status;
  } catch (error) {
    document.getElementById("status").textContent =
      "Серверге қосылмады";
  }
}

async function sendCommand() {
  const command =
    document.getElementById("command").value.trim();

  if (!command) {
    return;
  }

  const result = document.getElementById("result");

  result.textContent = "Команда орындалуда...";

  try {
    const response = await fetch("/admin/command", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ command })
    });

    const data = await response.json();

    result.textContent = data.message;
  } catch (error) {
    result.textContent = "Қате: серверге қосылмады.";
  }
}

checkStatus();
</script>

</body>
</html>
