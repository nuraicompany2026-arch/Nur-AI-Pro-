
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>NUR AI ADMIN</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header>
  <h1>⚙ NUR AI ADMIN</h1>
  <a href="/">Чатқа қайту</a>
</header>

<main class="wrap">

  <section class="panel">

    <h2>Басқару панелі</h2>

    <p class="hint">
      NUR AI PRO әкімшілік басқару жүйесі
    </p>

    <label for="key">Әкімші кілті</label>

    <input
      id="key"
      type="password"
      placeholder="Әкімші кілті">

    <br><br>

    <label for="command">Команда</label>

    <input
      id="command"
      placeholder="help немесе status">

    <br><br>

    <button id="run">
      Орындау
    </button>

    <pre id="result" class="msg bot">
Нәтиже осында шығады.
    </pre>

    <p class="hint">
      Әкімші кілтін ешкімге берме.
    </p>

  </section>

</main>

<script src="/admin/admin.js"></script>

</body>
</html>
