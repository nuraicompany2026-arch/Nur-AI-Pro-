
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUR AI PRO</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#090711;
color:white;
font-family:Arial,sans-serif;
}
header{
padding:18px;
background:#120c20;
border-bottom:1px solid #54218a;
display:flex;
justify-content:space-between;
align-items:center;
}
.logo{font-size:23px;font-weight:bold;color:#c38aff}
#status{font-size:12px;color:#9bffba}
.layout{display:flex;min-height:calc(100vh - 65px)}
aside{
width:230px;
background:#100b19;
padding:18px;
border-right:1px solid #29203a;
}
button{
border:0;
border-radius:10px;
padding:12px;
color:white;
background:#7629bd;
cursor:pointer;
}
aside button{width:100%;margin-bottom:12px}
main{
flex:1;
display:flex;
flex-direction:column;
padding:20px;
min-width:0;
}
#messages{
flex:1;
min-height:55vh;
overflow:auto;
padding:10px;
}
.message{
padding:14px;
margin:12px 0;
border-radius:12px;
max-width:85%;
white-space:pre-wrap;
line-height:1.5;
}
.user{background:#442078;margin-left:auto}
.ai{background:#191327;border:1px solid #47266a}
form{display:flex;gap:10px}
input{
flex:1;
min-width:0;
padding:15px;
border-radius:12px;
border:1px solid #63369a;
background:#171121;
color:white;
outline:none;
}
@media(max-width:600px){
aside{width:105px;padding:10px}
aside button{font-size:11px;padding:9px}
main{padding:10px}
}
</style>
</head>
<body>
<header>
<div class="logo">✦ NUR AI PRO</div>
<div id="status">● AI PLATFORM</div>
</header>

<div class="layout">
<aside>
<button onclick="newChat()">+ Жаңа чат</button>
<button onclick="location.href='/admin.html'">ADMIN</button>
<button onclick="showHistory()">Тарих</button>
</aside>

<main>
<div id="messages">
  <div class="message ai">
   Сәлем! Мен NUR AI PRO.
   Саған қалай көмектесе аламын?
  </div>
</div>

<form id="chatForm">
  <input id="question" placeholder="NUR AI-ға хабарлама жаз..." autocomplete="off">
  <button type="submit">Жіберу</button>
</form>
</main>
</div>

<script>
const messages=document.getElementById("messages");
const question=document.getElementById("question");

function addMessage(text,type){
const div=document.createElement("div");
div.className="message "+type;
div.textContent=text;
messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;
}

function newChat(){
messages.innerHTML="";
addMessage("Жаңа әңгіме басталды!","ai");
}

function showHistory(){
addMessage("Чат тарихы келесі модульде қосылады.","ai");
}

document.getElementById("chatForm").addEventListener("submit",async(e)=>{
e.preventDefault();
const text=question.value.trim();
if(!text)return;

addMessage(text,"user");
question.value="";

addMessage("AI серверімен байланыс модулі қосылуда...","ai");
});

const messages = document.getElementById("messages");
const question = document.getElementById("question");

let history = JSON.parse(
  localStorage.getItem("nur_ai_history") || "[]"
);

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function saveHistory() {
  try {
    localStorage.setItem(
      "nur_ai_history",
      JSON.stringify(history.slice(-100))
    );
  } catch (error) {
    console.error("Тарихты сақтау қатесі:", error);
  }
}

function newChat() {
  history = [];
  saveHistory();
  messages.innerHTML = "";
  addMessage("Жаңа әңгіме басталды!", "ai");
}

function showHistory() {
  messages.innerHTML = "";
  if (!history.length) {
    addMessage("Әзірге тарих бос.", "ai");
    return;
  }

  history.forEach(item => {
    addMessage(
      item.parts[0].text,
      item.role === "user" ? "user" : "ai"
    );
  });
}

document.getElementById("chatForm")
.addEventListener("submit", async (e) => {
  e.preventDefault();

  const text = question.value.trim();
  if (!text) return;

  addMessage(text, "user");
  question.value = "";

  const loading = document.createElement("div");
  loading.className = "message ai";
  loading.textContent = "NUR AI ойланып жатыр...";
  messages.appendChild(loading);

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text,
        history: history
      })
    });

    const data = await response.json();
    loading.remove();

    if (!response.ok) {
      throw new Error(data.error || "Сервер қатесі");
    }

    addMessage(data.answer, "ai");

    history.push(
      { role: "user", parts: [{ text }] },
      { role: "model", parts: [{ text: data.answer }] }
    );

    history = history.slice(-20);
    saveHistory();

  } catch (error) {
    loading.textContent = "Қате: " + error.message;
  }
});

history.forEach(item => {
  addMessage(
    item.parts[0].text,
    item.role === "user" ? "user" : "ai"
  );
});
<script src="memory-client.js"></script>
</body>
</html>
