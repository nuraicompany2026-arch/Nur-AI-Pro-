
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>NUR AI PRO</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header>
  <h1>✦ NUR AI PRO</h1>
  <span class="status" id="status">
    API-сіз режим
  </span>
</header>

<main class="wrap">

  <section class="panel">

    <h2>AI Chat</h2>

    <p class="hint">
      Жергілікті көмекші ядро • Қазақша интерфейс
    </p>

    <div
      class="messages"
      id="messages"
      aria-live="polite">
    </div>

    <form class="composer" id="chatForm">

      <input
        id="message"
        autocomplete="off"
        maxlength="2000"
        placeholder="Хабарлама жаз..."
        required>

      <button type="submit">
        Жіберу
      </button>

    </form>

    <div class="links">
      <a href="/admin">Әкімші панелі</a>
      <a href="/status" target="_blank">Жүйе күйі</a>
    </div>

  </section>

</main>

<script src="/app.js"></script>

</body>
</html>
